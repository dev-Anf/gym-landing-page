<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAFIT — Built by Discipline</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav" id="nav">
        <a href="#top" class="nav-brand">GRAFIT</a>
        <nav class="nav-links" aria-label="Main">
            <a href="#programs">Programs</a>
            <a href="#memberships">Memberships</a>
            <a href="#booking">Book</a>
        </nav>
        <a href="#booking" class="nav-cta">Join now</a>
    </header>

    <main>
        <!-- HERO -->
        <section class="hero" id="top">
            <div class="hero-copy">
                <span class="kicker">Now accepting new members</span>
                <h1 class="hero-title">
                    Built by<br>
                    <em>discipline.</em>
                </h1>
                <p class="hero-sub">
                    No shortcuts. No excuses. Just work — three programs, one coach per session.
                </p>
                <div class="hero-actions">
                    <a href="#booking" class="pill pill-dark">Start training</a>
                    <a href="#programs" class="pill pill-line">See programs</a>
                </div>
            </div>

            <div class="hero-window" data-window>
                <!-- ЛОКАЛЬНАЯ КАРТИНКА -->
                <img
                    src="images/hero.jpg"
                    alt="Inside the gym floor"
                    loading="eager"
                >
                <div class="hero-window-meta">
                    <span>01 — The floor</span>
                    <span>07:00 — 23:00</span>
                </div>
            </div>
        </section>
    </main>
    
    <footer></footer>
    <script src="script.js"></script>
</body>
</html>
